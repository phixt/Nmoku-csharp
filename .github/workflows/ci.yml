name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Nmoku.slnx (SDK 10 solution format) requires the 10.x SDK to even
          # discover the solution; projects still target net8.0.
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release --nologo
      - name: Test
        run: dotnet test tests/Nmoku.Core.Tests --configuration Release --nologo

  godot-smoke:
    runs-on: windows-latest
    needs: dotnet
    env:
      GODOT_VERSION: 4.6.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Nmoku.slnx (SDK 10 solution format) requires the 10.x SDK to even
          # discover the solution; projects still target net8.0.
          dotnet-version: 10.0.x
      - name: Build game assemblies
        # dotnet 作业的构建产物不跨 job 传递；Main.cs 是 C# 脚本，
        # 缺程序集时引擎报 "class could not be found" 且冒烟串不打印。
        run: dotnet build src/Nmoku.Game --nologo
      - name: Download Godot (.NET build)
        run: |
          $v = $env:GODOT_VERSION
          $url = "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v${v}-stable_mono_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot
      - name: Locate console executable
        id: exe
        run: |
          $exe = (Get-ChildItem -Path godot -Recurse -Filter "*_console.exe" | Select-Object -First 1).FullName
          "path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT
      - name: Import assets
        run: |
          & "${{ steps.exe.outputs.path }}" --headless --path src/Nmoku.Game --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Boot smoke test
        run: |
          $out = & "${{ steps.exe.outputs.path }}" --headless --path src/Nmoku.Game --quit 2>&1
          $out | ForEach-Object { Write-Output $_ }
          # PS 陷阱：-notmatch 作用于数组返回"未命中元素集合"而非布尔，
          # 引擎横幅行必然未命中 -> 集合非空 -> 恒为真。先拼成单串再匹配。
          $text = $out -join "`n"
          if ($text -notmatch "engine boot OK") { exit 1 }
          # 对局自测：胜负/悔棋/SWAP2 双分支/AI 应答（自跑自退）
          $auto = & "${{ steps.exe.outputs.path }}" --headless --path src/Nmoku.Game -- --autotest 2>&1
          $auto | ForEach-Object { Write-Output $_ }
          $atext = $auto -join "`n"
          if ($atext -notmatch "AUTOTEST ALL PASS") { exit 1 }
          exit 0
